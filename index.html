<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio ThingSpeak - Dark Night</title>
    <!-- Chart.js per i grafici -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;       /* Sfondo principale Dark Night */
            --card-bg: #151f32;        /* Sfondo dei blocchi/schede */
            --text-main: #f3f4f6;      /* Testo chiaro ad alta leggibilità */
            --text-muted: #9ca3af;     /* Testo secondario attenuato */
            --temp-color: #ff4a4a;     /* Neon Rosso per Temperatura */
            --press-color: #38bdf8;    /* Neon Azzurro per Pressione */
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --border-color: #22314d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Sezione Ultima Rilevazione */
        .live-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-live {
            background: var(--card-bg);
            padding: 18px 15px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* Indicatore luminoso neon sulla sommità del widget */
        .card-live::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .card-live.temp::before { background: var(--temp-color); box-shadow: 0 2px 10px var(--temp-color); }
        .card-live.press::before { background: var(--press-color); box-shadow: 0 2px 10px var(--press-color); }

        .card-live h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-live .value {
            font-size: 1.9rem;
            font-weight: 700;
        }
        
        .card-live.temp .value { color: #ff6b6b; }
        .card-live.press .value { color: #7dd3fc; }

        /* Contenitore Timestamp */
        .timestamp-container {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: rgba(21, 31, 50, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            width: 100%;
            border: 1px solid rgba(34, 49, 77, 0.4);
        }
        
        .timestamp-container strong {
            color: #e5e7eb;
        }

        /* Sezione Statistiche */
        .stats-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .stats-section h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: #e5e7eb;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .stat-box {
            padding: 10px 4px;
            background: #111a2e;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .stat-box span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-box strong {
            display: block;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Sezione Grafico */
        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            height: 320px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            font-size: 1rem;
            color: var(--text-muted);
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Meteo Dashboard</h1>
            <p>Canale ID: 3516549 &bull; Monitoraggio Notturno</p>
        </header>

        <div id="loader" class="loading">Sincronizzazione dati ThingSpeak in corso...</div>

        <div id="dashboard-content" class="hidden">
            <!-- Valori Real-time -->
            <div class="live-container">
                <div class="card-live temp">
                    <h2>Temperatura</h2>
                    <div class="value" id="live-temp">-- &deg;C</div>
                </div>
                <div class="card-live press">
                    <h2>Pressione</h2>
                    <div class="value" id="live-press">-- hPa</div>
                </div>
            </div>

            <!-- Box di Timestamp Aggiornamento -->
            <div class="timestamp-container">
                Ultimo aggiornamento: <strong id="live-timestamp">--/--/---- --:--:--</strong>
            </div>

            <!-- Stats Temperatura -->
            <div class="stats-section">
                <h3>Analisi Temperatura (12h)</h3>
                <div class="stats-grid">
                    <div class="stat-box"><span>MIN</span><strong id="temp-min" style="color: #60a5fa;">--</strong></div>
                    <div class="stat-box"><span>MAX</span><strong id="temp-max" style="color: #f87171;">--</strong></div>
                    <div class="stat-box"><span>MEDIA</span><strong id="temp-avg" style="color: #e5e7eb;">--</strong></div>
                </div>
            </div>

            <!-- Stats Pressione -->
            <div class="stats-section">
                <h3>Analisi Pressione (12h)</h3>
                <div class="stats-grid">
                    <div class="stat-box"><span>MIN</span><strong id="press-min" style="color: #60a5fa;">--</strong></div>
                    <div class="stat-box"><span>MAX</span><strong id="press-max" style="color: #f87171;">--</strong></div>
                    <div class="stat-box"><span>MEDIA</span><strong id="press-avg" style="color: #e5e7eb;">--</strong></div>
                </div>
            </div>

            <!-- Grafico -->
            <div class="chart-container">
                <canvas id="tsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const channelID = "3516549";
        const readAPIKey = "TV96LYPRY8JSDVR3";
        const resultsCount = 200; 
        const url = `https://thingspeak.com{channelID}/feeds.json?api_key=${readAPIKey}&results=${resultsCount}`;

        let myChart = null;

        async function fetchData() {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(!data.feeds || data.feeds.length === 0) return;

                const ormai = new Date();
                const dodiciOreFa = new Date(ormai.getTime() - (12 * 60 * 60 * 1000));
                
                const feeds12h = data.feeds.filter(feed => {
                    const feedTime = new Date(feed.created_at);
                    return feedTime >= dodiciOreFa;
                });

                if(feeds12h.length === 0) {
                    document.getElementById('loader').innerText = "Nessun dato registrato nelle ultime 12 ore.";
                    return;
                }

                const labels = [];
                const tempData = [];
                const pressData = [];

                feeds12h.forEach(feed => {
                    const date = new Date(feed.created_at);
                    const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    const t = parseFloat(feed.field1);
                    const p = parseFloat(feed.field2);

                    if (!isNaN(t) && !isNaN(p)) {
                        labels.push(timeString);
                        tempData.push(t);
                        pressData.push(p);
                    }
                });

                // Aggiornamento Box Live
                const ultimoFeed = feeds12h[feeds12h.length - 1];
